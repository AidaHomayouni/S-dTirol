<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STA Ereignismanagement – Klickdummy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#F5F5F5;--surface:#FFFFFF;--field:#EEEEEE;--field-h:#E4E4E4;--line:rgba(0,0,0,.12);
 --text:rgba(0,0,0,.87);--text2:rgba(0,0,0,.6);--text3:rgba(0,0,0,.38);
 --primary:#2196F3;--primary-d:#1976D2;--primary-t:rgba(33,150,243,.1);
 --error:#D32F2F;--error-t:#FDECEA;--warn:#ED6C02;--warn-t:#FFF4E5;--info-t:#E5F6FD;--info:#0288D1;--success:#2E7D32;
 --chip:#E0E0E0;--sws:#616161;--tip:rgba(97,97,97,.95);--proto:#263238;
 --shadow:0 8px 24px rgba(0,0,0,.18);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--surface:#1E1E1E;--field:#2A2A2A;--field-h:#333;--line:rgba(255,255,255,.12);--text:rgba(255,255,255,.92);--text2:rgba(255,255,255,.65);--text3:rgba(255,255,255,.4);--primary-t:rgba(33,150,243,.18);--error-t:#3a1d1d;--warn-t:#3a2a14;--info-t:#10303f;--chip:#3a3a3a;--sws:#9e9e9e;--proto:#0d1418;}}
:root[data-theme="dark"]{--bg:#121212;--surface:#1E1E1E;--field:#2A2A2A;--field-h:#333;--line:rgba(255,255,255,.12);--text:rgba(255,255,255,.92);--text2:rgba(255,255,255,.65);--text3:rgba(255,255,255,.4);--primary-t:rgba(33,150,243,.18);--error-t:#3a1d1d;--warn-t:#3a2a14;--info-t:#10303f;--chip:#3a3a3a;--sws:#9e9e9e;--proto:#0d1418;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.43 Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:currentColor;flex:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* prototype bar */
.proto{background:var(--proto);color:#fff;display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding:6px 16px;font-size:12px}
.proto b{font-weight:500;opacity:.7;margin-right:4px}
.pseg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:4px;overflow:hidden}
.pseg button{background:none;border:0;color:#fff;padding:3px 10px;cursor:pointer;font-size:12px}
.pseg button.on{background:rgba(255,255,255,.2)}
.proto .sp{flex:1}
.proto .link{background:none;border:0;color:#90CAF9;cursor:pointer;font-size:12px}

/* app bar */
.appbar{background:var(--surface);display:flex;align-items:center;gap:28px;padding:0 16px;height:48px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--primary-d)}
.logo span{width:28px;height:28px;border-radius:6px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:13px}
.nav{display:flex;gap:24px;font-weight:500;font-size:14px}
.nav a{color:var(--text);text-decoration:none;cursor:pointer}
.appbar .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:4px;border:1px solid transparent;background:none;font-weight:500;font-size:13px;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn svg.i{width:18px;height:18px}
.btn.c{background:var(--primary);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.btn.c:hover{background:var(--primary-d)}
.btn.o{border-color:rgba(33,150,243,.5);color:var(--primary)}
.btn.o:hover{background:var(--primary-t)}
.btn.t{color:var(--primary)}
.btn.t:hover{background:var(--primary-t)}
.btn.warn.o{border-color:rgba(237,108,2,.5);color:var(--warn)}
.btn.err.c{background:var(--error)}
.btn.err.o{border-color:rgba(211,47,47,.5);color:var(--error)}
.btn:disabled{background:rgba(0,0,0,.12)!important;color:var(--text3)!important;border-color:transparent!important;box-shadow:none;cursor:default}
.ib{width:32px;height:32px;border-radius:50%;border:0;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--text2)}
.ib:hover{background:rgba(0,0,0,.06)}
.ib.p{color:var(--primary)}

/* tooltip */
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--tip);color:#fff;font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;padding:4px 8px;border-radius:4px;white-space:nowrap;z-index:60;pointer-events:none}
[data-tip-r]:hover::after{left:auto;right:0;transform:none}

/* chips */
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;background:var(--chip);color:var(--text)}
.chip.Aktiv{background:#E8F5E9;color:#1B5E20}.chip.Entwurf{background:var(--chip)}.chip.Beendet{background:#FDE0E0;color:#B71C1C}
.chip.Angefragt{background:#FFE0B2;color:#C25E00}.chip.Abgelehnt{background:#FFCDD2;color:#B71C1C}.chip.Info{background:#B3E5FC;color:#01579B}
.lchip{display:inline-block;min-width:32px;text-align:center;background:#0B79B3;color:#fff;border-radius:3px;font-size:12px;font-weight:500;padding:1px 6px;margin-right:4px}

/* layout */
main{padding:16px}
.card{background:var(--surface);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:12px 16px;font-weight:500;font-size:14px;text-transform:uppercase;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--primary);border-color:var(--primary)}
.badge{background:var(--warn);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;line-height:18px}

/* table */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th{text-align:left;font-weight:500;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
td{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:hover td{background:rgba(0,0,0,.02)}
.toolbar{display:flex;gap:12px;align-items:center;padding:12px;flex-wrap:wrap}
.empty{padding:40px;text-align:center;color:var(--text2)}

/* fields */
.f{position:relative;background:var(--field);border-radius:4px 4px 0 0;border-bottom:1px solid rgba(0,0,0,.42);min-height:48px;padding:6px 12px 4px;display:flex;align-items:flex-end;gap:6px;cursor:text}
.f:hover{background:var(--field-h)}
.f.act{border-bottom:2px solid var(--primary)}
.f label{position:absolute;top:5px;left:12px;font-size:11px;color:var(--text2)}
.f input,.f select,.f textarea{border:0;background:none;outline:0;font:inherit;font-size:15px;color:var(--text);width:100%;padding:14px 0 2px}
.f select{appearance:none;cursor:pointer}
.f textarea{resize:vertical;min-height:44px}
.f .adorn{color:var(--text2);margin-bottom:2px;cursor:pointer}
.f.sel::after{content:"";position:absolute;right:12px;top:22px;border:5px solid transparent;border-top-color:var(--text2)}
.f.sm{min-height:44px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.grid2.dt{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px}
.grid2.dt .f{padding-left:10px;padding-right:8px}
.grid2.dt input{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
h2{font-size:18px;font-weight:500;margin:0}
h3{font-size:14px;font-weight:500;margin:0 0 12px}
.muted{color:var(--text2);font-size:12px}
.cbx{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.cbx input{width:18px;height:18px;accent-color:var(--primary);margin:0}

/* form */
.fhead{background:var(--surface);display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.fhead .t{font-weight:500;font-size:15px}
.fhead .meta{color:var(--text2);font-size:13px}
.fhead .meta b{color:var(--text);font-weight:500}
.fhead .sp{flex:1}
.fhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.alert{display:flex;gap:12px;padding:10px 16px;border-radius:4px;margin:12px 16px 0}
.alert .at{font-weight:500}
.alert.warn{background:var(--warn-t);color:#663C00}.alert.warn svg{color:var(--warn)}
.alert.info{background:var(--info-t);color:#014361}.alert.info svg{color:var(--info)}
.alert.err{background:var(--error-t);color:#5F2120}.alert.err svg{color:var(--error)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .alert{color:var(--text)}}
.fbody{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;align-items:start}
.fbody .side{display:flex;flex-direction:column;gap:16px}
.sec{padding:16px}
.sech{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sech .sp{flex:1}
.blocks{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:20px;padding:16px;border-bottom:1px solid var(--line)}
.bgroup{display:inline-flex;border:1px solid rgba(33,150,243,.5);border-radius:4px;overflow:hidden}
.bgroup button{border:0;background:none;color:var(--primary);font-size:11px;font-weight:500;padding:4px 7px;white-space:nowrap;text-transform:uppercase;cursor:pointer}
.bgroup button+button{border-left:1px solid rgba(33,150,243,.5)}
.bgroup button.on{background:var(--primary-t)}
.mtabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line)}
.channels{display:flex;flex-wrap:wrap;gap:24px;padding:16px}
.comment{display:flex;gap:10px;font-size:13px}
.comment .av{width:24px;height:24px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:500;flex:none}
.comment .who2{font-size:11px;color:var(--text2)}
.comment.rej .txt{color:var(--error)}
.hint{font-size:12px;color:var(--text2)}

/* popovers */
.pop{position:fixed;z-index:80;background:var(--surface);border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--line)}
.cal{padding:14px 14px 10px;width:276px}
.cal .ch{display:flex;align-items:center;margin-bottom:6px}
.cal .ch strong{flex:1;font-weight:500}
.cal .g{display:grid;grid-template-columns:repeat(7,34px);gap:2px}
.cal .g span{height:32px;display:grid;place-items:center;font-size:13px;border-radius:16px}
.cal .g .wd{color:var(--text2);font-size:12px}
.cal .g button{height:32px;border:0;background:none;border-radius:16px;cursor:pointer;font-size:13px;color:var(--text)}
.cal .g button:hover{background:rgba(0,0,0,.06)}
.cal .g button.o{color:var(--text3)}
.cal .g button.today{box-shadow:inset 0 0 0 1.5px var(--primary);color:var(--primary);font-weight:500}
.cal .g button.sel{background:var(--primary);color:#fff;font-weight:500}
.cal .cf{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--text2)}
.tl{width:160px;max-height:260px;overflow-y:auto;padding:6px 0}
.tl button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 16px;font-size:14px;cursor:pointer;position:relative;color:var(--text)}
.tl button:hover{background:rgba(0,0,0,.04)}
.tl button.sel{background:var(--primary-t);color:var(--primary);font-weight:500}
.tl button.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}

/* dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);border-radius:4px;box-shadow:var(--shadow);width:min(520px,100%);padding:20px 24px 12px}
.dlg h2{font-size:20px;margin-bottom:12px}
.dlg p{margin:0 0 16px;color:var(--text2)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* drawer */
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:70}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--surface);z-index:71;box-shadow:-8px 0 24px rgba(0,0,0,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer .dh{display:flex;align-items:flex-start;padding:16px 12px 14px 24px;border-bottom:1px solid var(--line)}
.drawer .dh div{flex:1}
.drawer .dh h2{font-size:20px}
.drawer .db{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.drawer .db>*{flex-shrink:0}
.drawer .db>.rule,.drawer .db>.hint{align-self:stretch}
.drawer .df{border-top:1px solid var(--line);padding:12px 24px 16px;display:flex;flex-direction:column;gap:12px}
.summary{background:var(--primary-t);border-radius:4px;padding:10px 12px;font-size:13px}
.cap{font-size:12px;font-weight:500;color:var(--text2)}
.seg{display:inline-flex;border:1px solid rgba(33,150,243,.5);border-radius:4px;overflow:hidden}
.seg button{border:0;background:none;color:var(--primary);font-weight:500;font-size:13px;padding:6px 12px;text-transform:uppercase;cursor:pointer}
.seg button+button{border-left:1px solid rgba(33,150,243,.5)}
.seg button.on{background:var(--primary-t)}
.rule{border:1px solid var(--line);border-radius:8px;padding:12px 8px 12px 16px;display:flex;flex-direction:column;gap:10px}
.rule .rh{display:flex;align-items:center}
.rule .rh strong{flex:1;font-weight:500}
.wk{display:flex;gap:4px}
.wk button{width:36px;height:36px;border:0;border-radius:4px;background:rgba(0,0,0,.06);color:var(--text2);font-size:13px;cursor:pointer}
.wk button.on{background:var(--sws);color:#fff;font-weight:500}
.quick{display:flex;gap:12px;font-size:12px}
.quick button{border:0;background:none;padding:0;color:var(--text2);cursor:pointer;font-size:12px}
.quick button.on{color:var(--primary);font-weight:500}
.win{display:flex;align-items:center;gap:8px}
.win .f{width:120px}
.win .note{font-size:12px;color:var(--text2)}
.radio{display:flex;align-items:center;gap:8px;cursor:pointer}
.radio input{width:18px;height:18px;accent-color:var(--primary);margin:0}
.inl{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{width:64px}

/* toast */
.toast{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#323232;color:#fff;padding:12px 16px;border-radius:4px;box-shadow:var(--shadow);z-index:90;font-size:14px;display:flex;gap:16px;align-items:center}

@media (max-width:1100px){.blocks{grid-template-columns:repeat(2,minmax(200px,1fr))}.fbody{grid-template-columns:1fr}}
@media (max-width:640px){.blocks{grid-template-columns:1fr}.nav{display:none}.fhead .meta{display:none}}
/* ---- app shell additions ---- */
.appbar .nav{align-items:center;gap:8px}
.navi{position:relative}
.navb{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:6px 10px;border-radius:4px;font-weight:500;font-size:14px;cursor:pointer;color:var(--text)}
.navb.on{background:var(--primary);color:#fff}
.navb svg.i{width:18px;height:18px}
.menu{position:absolute;top:calc(100% + 4px);left:0;background:var(--surface);border-radius:4px;box-shadow:var(--shadow);min-width:220px;padding:6px 0;z-index:65}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 16px;font-size:14px;cursor:pointer;color:var(--text)}
.menu button:hover{background:rgba(0,0,0,.05)}
.menu button.on{color:var(--primary);font-weight:500}
.bell{display:inline-flex;align-items:center;gap:4px;background:var(--error);color:#fff;border:0;border-radius:4px;height:26px;padding:0 8px;font-size:13px;font-weight:500;cursor:pointer}
.bell svg.i{width:16px;height:16px}
.bell.zero{background:var(--chip);color:var(--text2)}
.notif{position:absolute;right:0;top:calc(100% + 6px);width:360px;background:var(--surface);border-radius:6px;box-shadow:var(--shadow);z-index:65;overflow:hidden}
.notif h4{margin:0;padding:12px 16px;font-size:14px;font-weight:500;border-bottom:1px solid var(--line)}
.notif button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 16px;cursor:pointer;color:var(--text)}
.notif button:hover{background:rgba(0,0,0,.03)}
.notif .nd{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:6px;flex:none}
.notif small{display:block;color:var(--text2);font-size:12px}
.lang{font-weight:500;background:none;border:0;cursor:pointer;color:var(--text);padding:4px 6px}
.page{padding:16px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:20px;font-weight:500;margin:0}
.ph .sp{flex:1}
.crumb{font-size:12px;color:var(--text2);margin-bottom:2px}
.crumb a{color:var(--text2);cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.filters .f{min-width:200px}
.cols{display:grid;gap:16px;align-items:start}
.err-t{color:var(--error);font-size:12px;margin:2px 12px 0}
.f.err{border-bottom:2px solid var(--error)}
.f.err label{color:var(--error)}

/* login */
.login{min-height:calc(100vh - 34px);display:grid;place-items:center;background:var(--bg);padding:24px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:4px;width:min(400px,100%);padding:28px 36px 24px;display:flex;flex-direction:column;gap:14px}
.lcard .lg{align-self:center;margin-bottom:6px}
.or{display:flex;align-items:center;gap:12px;color:var(--text2);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.ms{display:flex;align-items:center;justify-content:center;gap:10px;height:40px;border:1px solid #8C8C8C;border-radius:2px;background:#fff;color:#5E5E5E;font-weight:600;font-size:15px;cursor:pointer;font-family:"Segoe UI",Roboto,sans-serif}
.ms:hover{background:#F3F3F3}
.ms i{display:grid;grid-template-columns:9px 9px;gap:1px}
.ms i b{width:9px;height:9px;display:block}
.policy{background:var(--info-t);border-radius:4px;padding:10px 14px;font-size:13px;color:#014361}
.policy ul{list-style:none;margin:6px 0 0;padding:0}
.policy li{display:flex;gap:6px;align-items:center}
.policy li.ok{color:var(--success)}
.policy li svg{width:16px;height:16px}

/* dashboard */
.gantt{padding:12px 16px}
.grow{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:center;margin-bottom:4px}
.gid{background:#43A047;color:#fff;font-size:12px;font-weight:500;border-radius:3px;text-align:center;padding:2px 0;cursor:pointer;border:0}
.gtrack{position:relative;height:20px}
.gbar{position:absolute;top:0;height:20px;border-radius:2px}
.gbar.p{background:#B3E5FC}
.gbar.e{background:#0288D1;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 8px}
.gtoday{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--error);opacity:.7}
.glegend{display:flex;gap:20px;align-items:center;font-size:13px;margin-top:10px}
.glegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.gaxis{display:grid;grid-template-columns:76px 1fr;gap:8px;font-size:11px;color:var(--text2);margin-bottom:6px}
.gaxis div{position:relative;height:14px}
.gaxis span{position:absolute;transform:translateX(-50%)}
.chip.Kommende{background:#FFF9C4;color:#827717}.chip.Erinnerung{background:#FFCDD2;color:#B71C1C}.chip.Zukünftige{background:#E1BEE7;color:#6A1B9A}.chip.Bald{background:#B3E5FC;color:#01579B}.chip.Blockiert{background:#FFCDD2;color:#B71C1C}

.hstatus{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:8px;margin-bottom:16px;border:1px solid var(--line);background:var(--surface)}

.hdot{width:12px;height:12px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px rgba(237,108,2,.2);flex:none}
.hstatus.off .hdot{background:var(--success);box-shadow:0 0 0 4px rgba(46,125,50,.2)}

function statusLabel(s){return s==='Angefragt'?'Freigabe angefragt':s==='Abgelehnt'?'Freigabe abgelehnt':s;}
function actions(e){
 const end=isInfo()?`<button class="btn err c" id="aEnd" data-tip="Ereignis beenden und Endmeldung senden">Beenden</button>`
  :`<span data-tip="Keine Berechtigung zum Beenden"><button class="btn err c" disabled>Beenden</button></span>`;
 let main='';
 if(isInfo()){
  main=e.status==='Angefragt'
   ?`<button class="btn err o" id="aReject" data-tip="Freigabe ablehnen – Begründung erscheint im Kommentar">Ablehnen</button><button class="btn c" id="aApprove" data-tip="Prüfen und an die gewählten Ausgabekanäle senden" data-tip-r>Freigeben &amp; senden</button>`
   :`<button class="btn c" id="aSend" data-tip="Speichern und an die gewählten Ausgabekanäle senden" data-tip-r>Senden</button>`;
 } else if(!S.hours){
  main=`<button class="btn c" id="aSend" data-tip="Außerhalb der Betriebszeit direkt senden" data-tip-r>Senden</button>`;
 } else if(e.status==='Angefragt'){
  main=S.dirty?`<button class="btn c" id="aUpdate" data-tip="Änderungen speichern – Freigabe-Anfrage bleibt bestehen" data-tip-r>Anfrage aktualisieren</button>`
   :`<span data-tip="Keine Änderungen" data-tip-r><button class="btn c" disabled>Anfrage aktualisieren</button></span>`;
 } else {
  main=`<button class="btn c" id="aRequest" data-tip="Zur Freigabe an STA-Infomanager senden" data-tip-r>Freigabe anfordern</button>`;
 }
 return `<button class="btn o" id="aClose" data-tip="Formular schließen">Schließen</button><button class="btn warn o" id="aDraft" data-tip="Als Entwurf speichern – wird nicht veröffentlicht">Entwurf</button>${end}${main}`;
}
function alertBox(e){

 if(e.status==='Angefragt') return `<div class="alert info" role="status">${ic('info')}<div><div class="at">Freigabe angefragt</div>Angefragt am ${e.at}. Wird von einem STA-Infomanager geprüft. Die zuletzt gesendete Version bleibt aktiv. ${S.hours?'Änderungen können weiterhin gespeichert werden.':'Die Betriebszeit ist vorbei – Sie können jetzt direkt senden.'}</div></div>`;
 if(e.status==='Abgelehnt') return `<div class="alert err" role="status">${ic('err')}<div><div class="at">Freigabe abgelehnt</div>Abgelehnt von ${esc(e.rejBy)} am ${e.rejAt}${e.reason?` · Begründung: „${esc(e.reason)}“`:''}. ${isInfo()?'':'Ereignis anpassen und erneut zur Freigabe anfordern.'}</div></div>`;
 return '';
}

 $('#app').innerHTML=`<div class="page"><div class="ph"><div><div class="crumb"><a data-back>Anwenderrollen</a> / Anwenderrollen verwalten</div><h1>Anwenderrollen verwalten</h1></div><span class="sp"></span>${r.id?`<button class="btn err c" id="rDel">Rolle löschen</button>`:''}<button class="btn c" id="rSave">Speichern</button></div>
 <div style="max-width:1040px;margin:0 auto"><div class="alert info" style="margin:0 0 16px">${ic('info')}<div>Änderungen werden auf alle ${n} Benutzer mit dieser Rolle angewendet.</div></div>
 <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card sec stack"><h3 style="font-size:16px;margin:0">Details</h3>${inF('Rollenname *',r.name,'id="rN"')}${inF('Rollenbeschreibung',r.desc,'id="rD"')}</div>
 <div class="card sec stack"><h3 style="font-size:16px;margin:0">Berechtigungen</h3><div id="rTree">${treeHTML(r.perms)}</div><div class="hint"><code>ereignis_senden</code> erlaubt direktes Senden in der Betriebszeit. Ohne dieses Recht braucht der Nutzer eine Freigabe.</div></div></div></div></div>`;
 $('[data-back]').onclick=()=>go('roles');
 const tr=()=>{$('#rTree').innerHTML=treeHTML(r.perms);bindTree($('#rTree'),r.perms,tr);};bindTree($('#rTree'),r.perms,tr);
 $('#rSave').onclick=()=>{r.name=$('#rN').value.trim();r.desc=$('#rD').value.trim();if(!r.name){toast('Bitte einen Rollennamen eingeben');return;}if(!r.id){r.id=Date.now();S.roles.push(r);}toast('Rolle gespeichert');go('roles');};
 $('#rDel')&&($('#rDel').onclick=()=>dialog({title:'Rolle löschen?',text:n?`${n} Nutzer haben diese Rolle. Weisen Sie ihnen vorher eine andere Rolle zu.`:`Die Rolle „${esc(r.name)}“ wird gelöscht.`,ok:'Löschen',okCls:'err c',onOk:()=>{if(n){toast('Rolle ist noch zugewiesen – nicht gelöscht');return;}S.roles=S.roles.filter(x=>x!==r);go('roles');toast('Rolle gelöscht');}}));}

/* ---------- shell ---------- */
function respTables(root=document){$$('table',root).forEach(t=>{t.classList.add('resp');const hs=$$('thead th',t).map(th=>th.textContent.trim());
 $$('tbody tr',t).forEach(tr=>[...tr.children].forEach((td,i)=>{td.dataset.label=hs[i]||'';if(td.querySelector('.ib')&&!td.textContent.trim())td.classList.add('acts-cell');}));});}
new MutationObserver(()=>respTables($('#app'))).observe(document.getElementById('app'),{childList:true,subtree:true});
function render(){
 $$('#roleSeg button').forEach(b=>b.classList.toggle('on',b.dataset.role===S.role));
 $$('#hoursSeg button').forEach(b=>b.classList.toggle('on',(b.dataset.hours==='1')===S.hours));
 $$('#dvSeg button').forEach(b=>b.classList.toggle('on',b.dataset.dv2===S.dv));
 closePop();renderBar();
 ({login:renderLogin,reset:renderReset,dashboard:renderDashboard,map:renderMap,list:renderList,form:renderForm,betriebszeiten:renderHours,unterursachen:renderSubs,textbausteine:renderTB,users:renderUsers,user:renderUser,roles:renderRoles,role:renderRole}[S.view]||renderDashboard)();
 respTables();
}
$$('#roleSeg button').forEach(b=>b.onclick=()=>{S.role=b.dataset.role;S.dirty=false;$('#layer').innerHTML='';render();toast(isInfo()?'Ansicht: STA-Infomanager':'Ansicht: Mandant');});
$$('#hoursSeg button').forEach(b=>b.onclick=()=>{S.hours=b.dataset.hours==='1';render();toast(S.hours?'Während der Betriebszeit':'Außerhalb der Betriebszeit');});
$$('#dvSeg button').forEach(b=>b.onclick=()=>{S.dv=b.dataset.dv2;$$('#dvSeg button').forEach(x=>x.classList.toggle('on',x.dataset.dv2===S.dv));if($('.drawer')){const e=ev();drawDrawer(e);}toast('Datum-Variante: '+(S.dv==='A'?'Felder':'Kalender'));});
$('#reset').onclick=()=>{S.events=seed();seedAdmin();S.view='login';S.tab='alle';S.dirty=false;$('#layer').innerHTML='';render();toast('Daten zurückgesetzt');};
$('#jump').onchange=e=>{const v=e.target.value;e.target.value='';if(!v)return;if(v==='freigaben'){S.tab='freigaben';go('list');}else go(v);};
render();

</script>
</body>
